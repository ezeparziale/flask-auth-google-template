services:

  app:
    hostname: app
    container_name: app
    build: .
    ports:
      - 5000:5000
    env_file:
      - ./.env
    depends_on:
      - db
    networks:
      - app_net

  db:
    image: postgres:17.6
    hostname: postgres_db
    container_name: postgres_db
    restart: always
    ports:
      - 5432:5432
    env_file:
      - ./.env.db
    volumes:
      - postgres-db:/var/lib/postgresql/data
    networks:
      - app_net

  adminer:
    image: adminer:5.2.1
    hostname: adminer
    container_name: adminer
    restart: always
    ports:
      - 8080:8080
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DESIGN=hever
    networks:
      - app_net

volumes:
  postgres-db:

networks:
  app_net:
    name: app_net
